<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de ingreso de datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/validar_datos.js"></script>
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Ingreso de datos</h1>
    </header>
    <section class="container my-5">
        <article class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Formulario</h2>
                <form action="procesar_datos.php" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre completo:</label>
                        <input type="text" id="name" name="name" class="form-control"
                            placeholder="Ingrese su nombre completo" required>
                    </div>
                    <div class="mb-3">
                        <label for="place" class="form-label">Lugar de nacimiento</label>
                        <div class="mb-3">
                            <label for="select_country" class="form-label">Seleccione su pais de recidencia:</label>
                            <div class="mb-3">
                                <select select id="select_country" name="select_country">
                                    <option value="ElSalvador">El salvador</option>
                                    <option value="CostaRica">Costa Rica</option>
                                    <option value="Honduras">Honduras</option>
                                    <option value="Guatemala">Guatemala</option>
                                    <option value="Nicaragua">Nicaragua</option>
                                    <option value="Panama">Panama</option>
                                    <option value="Belice">Belice</option>
                                    <option value="Mexico">Mexico</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="select_department" class="form-label">Seleccione el departamente:</label>
                            <div class="mb-3">
                                <select id="select_department" name="select_department">
                                    <option value="SanSalvador">San Salvador</option>
                                    <option value="SantaAna">Santa Ana</option>
                                    <option value="Sonsonate">Sonsonate</option>
                                    <option value="Usulutan">Usulutan</option>
                                    <option value="SanMiguel">San Miguel</option>
                                    <option value="LaUnion">La Union</option>
                                    <option value="Morazan">Morazan</option>
                                    <option value="LaPaz">La Paz</option>
                                    <option value="Cuscatlan">Cuscatlan</option>
                                    <option value="Chalatenango">Chalatenango</option>
                                    <option value="Ahuachapan">Ahuachapan</option>
                                    <option value="LaLibertad">La Libertad</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="year" class="form-label">Edad:</label>
                        <input type="number" id="year" name="year" class="form-control" placeholder="Ingrese su edad"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="carnet" class="form-label">Carnet:</label>
                        <input type="text" id="carnet" name="carnet" class="form-control"
                            placeholder="Ingrese su carnet" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" id="enviar" name="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </article>
    </section>
    <script>
        const departmentsByCountry = {
            ElSalvador: [
                { value: "SanSalvador", text: "San Salvador" },
                { value: "SantaAna", text: "Santa Ana" },
                { value: "Sonsonate", text: "Sonsonate" },
                { value: "Usulutan", text: "Usulutan" }
            ],
            Guatemala: [
                { value: "Guatemala", text: "Guatemala" },
                { value: "Escuintla", text: "Escuintla" },
                { value: "Quetzaltenango", text: "Quetzaltenango" },
                { value: "Huehuetenango", text: "Huehuetenango" }
            ],
            Honduras: [
                { value: "Atlantida", text: "Atlántida" },
                { value: "Cortes", text: "Cortés" },
                { value: "Copan", text: "Copán" },
                { value: "Olancho", text: "Olancho" }
            ],
            CostaRica: [
                { value: "SanJose", text: "San José" },
                { value: "Alajuela", text: "Alajuela" },
                { value: "Cartago", text: "Cartago" },
                { value: "Heredia", text: "Heredia" }
            ],
            Nicaragua: [
                { value: "Boaco", text: "Boaco" },
                { value: "Carazo", text: "Carazo" },
                { value: "Chinandega", text: "Chinandega" },
                { value: "Esteli", text: "Estelí" }
            ],
            Panama: [
                { value: "BocasDelToro", text: "Bocas del Toro" },
                { value: "Chiriqui", text: "Chiriquí" },
                { value: "Cocle", text: "Coclé" },
                { value: "Colon", text: "Colón" }
            ],
            Belice: [
                { value: "Belize", text: "Belize" },
                { value: "Cayo", text: "Cayo" },
                { value: "Corozal", text: "Corozal" },
                { value: "OrangeWalk", text: "Orange Walk" }
            ],
            Mexico: [
                { value: "Chihuahua", text: "Chihuahua" },
                { value: "Jalisco", text: "Jalisco" },
                { value: "NuevoLeon", text: "Nuevo León" },
                { value: "Yucatan", text: "Yucatán" }
            ]
        };

        const countrySelect = document.getElementById("select_country");
        const departmentSelect = document.getElementById("select_department");

        countrySelect.addEventListener("change", () => {
            const selectedCountry = countrySelect.value;

            // Clear existing department options
            departmentSelect.innerHTML = "";

            // Add default option or new options based on the country
            if (departmentsByCountry[selectedCountry]) {
                departmentsByCountry[selectedCountry].forEach(department => {
                    const option = document.createElement("option");
                    option.value = department.value;
                    option.textContent = department.text;
                    departmentSelect.appendChild(option);
                });
            } else {
                // If no specific departments are defined for a country, you can add a placeholder
                const defaultOption = document.createElement("option");
                defaultOption.value = "";
                defaultOption.textContent = "Seleccione un departamento";
                departmentSelect.appendChild(defaultOption);
            }
        });
    </script>
</body>

</html>
